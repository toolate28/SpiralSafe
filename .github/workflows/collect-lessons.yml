name: Collect Lessons

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "docs/**"

jobs:
  collect:
    runs-on: windows-latest
    name: Run lesson collection
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run collect_lessons.ps1
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\collect_lessons.ps1

      - name: Upload lesson artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lessons-summary
          path: docs/staging/lessons_summary.*

      - name: Post summary to PR (when applicable)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs')
            const path = 'docs/staging/lessons_summary.md'
            let md = 'No summary generated.'
            if (fs.existsSync(path)) md = fs.readFileSync(path, 'utf8')
            const body = 'Automated lesson summary generated by workflow:\n\n' + '----\n' + md
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            })
