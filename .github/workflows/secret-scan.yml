name: Secret scan

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *" # daily
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          args: --path=. --verbose

  detect-secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.x"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets
      - name: Run detect-secrets
        run: |
          # Fail the job if any new secrets are found
          detect-secrets scan --baseline .secrets.baseline --all-files
      - name: Make scan script executable
        run: |
          chmod +x scripts/scan-secrets.sh || true
      - name: Run repository secrets scan
        run: |
          [ -f ./scripts/scan-secrets.sh ] && ./scripts/scan-secrets.sh || echo "No scan script found"
