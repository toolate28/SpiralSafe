name: Secret scan

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *" # daily
  pull_request:
  push:
    branches:
      - main

jobs:
  internal-secret-scan:
    name: Internal Secret Scan (Fail Closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify internal scanner entrypoint
        run: |
          set -euo pipefail
          test -f ./scripts/scan-secrets.sh || {
            echo "::error::Missing required internal scanner: scripts/scan-secrets.sh"
            exit 1
          }
      - name: Run internal repository secret scan
        run: |
          set -euo pipefail
          chmod +x ./scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh
