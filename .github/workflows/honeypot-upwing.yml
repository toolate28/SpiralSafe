name: Honeypot Upwing

permissions:
  contents: read
  metadata: read

concurrency:
  group: honeypot-upwing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
    inputs:
      stagger_seconds:
        description: "Delay between stage 1 and stage 2"
        type: number
        default: 90
      coherence_target:
        description: "Target coherence value"
        type: string
        default: "1.00"
      data_watermark:
        description: "Specific watermark token"
        type: string
        default: "SPIRALSAFE-WATERMARK-UH-001"

env:
  COHERENCE_TARGET: ${{ github.event.inputs.coherence_target || '1.00' }}
  STAGGER_SECONDS: ${{ github.event.inputs.stagger_seconds || 90 }}
  DATA_WATERMARK: ${{ github.event.inputs.data_watermark || 'SPIRALSAFE-WATERMARK-UH-001' }}

jobs:
  guardrail-intent:
    name: Guardrail Intent Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      stagger_seconds: ${{ steps.guard.outputs.stagger_seconds }}
      coherence_target: ${{ steps.guard.outputs.coherence_target }}
      data_watermark: ${{ steps.guard.outputs.data_watermark }}
    steps:
      - name: Validate actor and inputs
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PERMISSION="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission // "none"')"
            case "$PERMISSION" in
              admin|maintain|write) ;;
              *)
                echo "::error::manual dispatch requires write+ repository permission"
                exit 1
                ;;
            esac
          fi

          STAGGER="${{ env.STAGGER_SECONDS }}"
          if ! [[ "$STAGGER" =~ ^[0-9]+$ ]]; then
            echo "::error::stagger_seconds must be an integer"
            exit 1
          fi
          if [ "$STAGGER" -lt 30 ] || [ "$STAGGER" -gt 900 ]; then
            echo "::error::stagger_seconds out of safe bounds (30-900)"
            exit 1
          fi

          COHERENCE="${{ env.COHERENCE_TARGET }}"
          if ! [[ "$COHERENCE" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]]; then
            echo "::error::coherence_target must be numeric in [0,1]"
            exit 1
          fi
          if [ "$(awk "BEGIN {print ($COHERENCE < 0.60 || $COHERENCE > 1.00) ? 1 : 0}")" -eq 1 ]; then
            echo "::error::coherence_target must stay within [0.60, 1.00]"
            exit 1
          fi

          WATERMARK="${{ env.DATA_WATERMARK }}"
          if ! [[ "$WATERMARK" =~ ^[A-Z0-9._:-]{8,80}$ ]]; then
            echo "::error::data_watermark must match ^[A-Z0-9._:-]{8,80}$"
            exit 1
          fi

          echo "stagger_seconds=$STAGGER" >> "$GITHUB_OUTPUT"
          echo "coherence_target=$COHERENCE" >> "$GITHUB_OUTPUT"
          echo "data_watermark=$WATERMARK" >> "$GITHUB_OUTPUT"

  stage-one-honeypot:
    name: Stage 1 — Torch Sheet Projection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guardrail-intent]
    outputs:
      tack: ${{ steps.mark.outputs.tack }}
      coherence: ${{ steps.mark.outputs.coherence }}
      epoch: ${{ steps.mark.outputs.epoch }}
      watermark: ${{ steps.mark.outputs.watermark }}
      unitary_projection: ${{ steps.mark.outputs.unitary_projection }}
    steps:
      - name: Mark upwing tack
        id: mark
        run: |
          set -euo pipefail
          UNITARY_PROJECTION="$(printf '%s' "${{ needs.guardrail-intent.outputs.data_watermark }}|unitary|${{ needs.guardrail-intent.outputs.coherence_target }}" | sha256sum | awk '{print $1}')"
          echo "tack=upwing" >> "$GITHUB_OUTPUT"
          echo "coherence=${{ needs.guardrail-intent.outputs.coherence_target }}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "watermark=${{ needs.guardrail-intent.outputs.data_watermark }}" >> "$GITHUB_OUTPUT"
          echo "unitary_projection=$UNITARY_PROJECTION" >> "$GITHUB_OUTPUT"
          echo "Stage 1 armed: torch + sheet projection marker created"

  stage-two-crystallisation:
    name: Stage 2 — Saturation Crystallisation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guardrail-intent, stage-one-honeypot]
    steps:
      - name: Stagger execution
        run: |
          set -euo pipefail
          sleep "${{ needs.guardrail-intent.outputs.stagger_seconds }}"

      - name: Verify maximum coherence upwing
        run: |
          set -euo pipefail
          if [ "${{ needs.stage-one-honeypot.outputs.tack }}" != "upwing" ]; then
            echo "::error::Upwing tack marker missing"
            exit 1
          fi
          if [ "${{ needs.stage-one-honeypot.outputs.coherence }}" != "${{ needs.guardrail-intent.outputs.coherence_target }}" ]; then
            echo "::error::Coherence target mismatch"
            exit 1
          fi
          if [ -z "${{ needs.stage-one-honeypot.outputs.watermark }}" ]; then
            echo "::error::Watermark missing"
            exit 1
          fi
          HAMILTONIAN_DISPERSION="$(printf '%s' "${{ needs.stage-one-honeypot.outputs.unitary_projection }}|hamiltonian|${{ needs.stage-one-honeypot.outputs.epoch }}" | sha256sum | awk '{print $1}')"
          echo "hamiltonian_dispersion=$HAMILTONIAN_DISPERSION" >> "$GITHUB_ENV"
          echo "H&&S:SYNC — tack upwing at maximum coherence"
          echo "epoch=${{ needs.stage-one-honeypot.outputs.epoch }}"

      - name: Job summary
        run: |
          set -euo pipefail
          echo "## Honeypot Upwing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage 1 marker: \`${{ needs.stage-one-honeypot.outputs.tack }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage 2 stagger: \`${{ needs.guardrail-intent.outputs.stagger_seconds }}s\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coherence target: \`${{ needs.guardrail-intent.outputs.coherence_target }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data watermark: \`${{ needs.stage-one-honeypot.outputs.watermark }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unitary projection: \`${{ needs.stage-one-honeypot.outputs.unitary_projection }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hamiltonian dispersion: \`${hamiltonian_dispersion:-unavailable}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **crystallised**" >> "$GITHUB_STEP_SUMMARY"

  fail-closure:
    name: Fail Closure — Residual Zero
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guardrail-intent, stage-one-honeypot, stage-two-crystallisation]
    if: always()
    steps:
      - name: Enforce pass pass fail closure
        run: |
          set -euo pipefail
          GATE_RESULT="${{ needs.guardrail-intent.result }}"
          STAGE_ONE_RESULT="${{ needs.stage-one-honeypot.result }}"
          STAGE_TWO_RESULT="${{ needs.stage-two-crystallisation.result }}"
          RESIDUAL=0

          if [ "$GATE_RESULT" != "success" ]; then
            RESIDUAL=1
          fi
          if [ "$STAGE_ONE_RESULT" != "success" ]; then
            RESIDUAL=1
          fi
          if [ "$STAGE_TWO_RESULT" != "success" ]; then
            RESIDUAL=1
          fi

          if [ "$RESIDUAL" -ne 0 ]; then
            echo "::error::fail closure violated (residual != 0)"
            echo "pass pass fail => FAIL FAIL FAIL"
            exit 1
          fi

          echo "residual=0"
          echo "pass pass fail => PASS PASS FAIL-CLOSED"
